name: CI/CD Pipeline - Build, Test, ACR Push & GitOps Deploy

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Semantic Version override (e.g. 1.0.0). Leave blank for auto-calculated version.'
        required: false
        default: ''

permissions:
  id-token: write   # Required when using Azure OIDC Workload Identity Federation
  contents: write   # Required to commit updated image tags to GitOps Helm values

env:
  DOTNET_VERSION: '10.0.x'
  IMAGE_NAME: 'refitdemo'
  SOLUTION_NAME: 'RefitDemo.sln'
  VERSION_MAJOR: '1'
  VERSION_MINOR: '0'

jobs:
  # ============================================================================
  # Job 1: Build & Automated Testing (.NET 10)
  # ============================================================================
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet Dependencies
        run: dotnet restore ${{ env.SOLUTION_NAME }}

      - name: Build Solution (Release)
        run: dotnet build ${{ env.SOLUTION_NAME }} --no-restore -c Release

      - name: Run Unit & Integration Tests
        run: dotnet test ${{ env.SOLUTION_NAME }} --no-build -c Release --verbosity normal

  # ============================================================================
  # Job 2: Build Docker Image & Push to Azure Container Registry (ACR)
  # Supports BOTH:
  #   Option A: ACR Username & Password (ACR Admin or Service Principal)
  #   Option B: Azure OIDC Workload Identity Federation
  # ============================================================================
  docker-acr-build-push:
    name: Build & Push Docker Image to ACR
    needs: build-and-test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      image_repository: ${{ steps.vars.outputs.acr_repo }}
    env:
      ACR_NAME: ${{ vars.ACR_NAME || secrets.ACR_NAME }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate SemVer Image Tag & Repository Variables
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          
          # Calculate Semantic Version build number: Major.Minor.Patch (e.g. 1.0.0)
          if [ -n "${{ github.event.inputs.version_override }}" ]; then
            BUILD_VERSION="${{ github.event.inputs.version_override }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            BUILD_VERSION="${GITHUB_REF_NAME#v}"
          else
            # Derive patch number from GitHub run number (0-indexed: run 1 -> 1.0.0, run 2 -> 1.0.1)
            PATCH=$(( GITHUB_RUN_NUMBER - 1 ))
            BUILD_VERSION="${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.${PATCH}"
          fi
          
          echo "Building image version: ${BUILD_VERSION} (commit: ${SHA_SHORT})"
          echo "image_tag=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "acr_name=${ACR_NAME}" >> "$GITHUB_OUTPUT"
          echo "acr_server=${ACR_NAME}.azurecr.io" >> "$GITHUB_OUTPUT"
          echo "acr_repo=${ACR_NAME}.azurecr.io/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------------
      # ACR Authentication Option A: Username / Password (Admin or SP)
      # Triggered if ACR_USERNAME and ACR_PASSWORD secrets are present
      # ------------------------------------------------------------------------
      - name: "Log in to ACR (Option A: Username / Password)"
        if: env.ACR_USERNAME != '' && env.ACR_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.vars.outputs.acr_server }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      # ------------------------------------------------------------------------
      # ACR Authentication Option B: Azure OIDC / CLI (Passwordless fallback)
      # Triggered if ACR_USERNAME is not set
      # ------------------------------------------------------------------------
      - name: "Azure Login (Option B: OIDC Federated Credentials)"
        if: env.ACR_USERNAME == '' || env.ACR_PASSWORD == ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry via Azure CLI
        if: env.ACR_USERNAME == '' || env.ACR_PASSWORD == ''
        run: |
          az acr login --name ${{ steps.vars.outputs.acr_name }}

      # ------------------------------------------------------------------------
      # Build and Push Docker Image
      # ------------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.acr_server }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
            ${{ steps.vars.outputs.acr_server }}/${{ env.IMAGE_NAME }}:${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}
            ${{ steps.vars.outputs.acr_server }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.vars.outputs.acr_server }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Job 3: GitOps Promotion - Update Helm values.yaml image tag
  # ============================================================================
  update-gitops-helm:
    name: Promote Image Tag to GitOps Helm Chart
    needs: docker-acr-build-push
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ACR_NAME: ${{ vars.ACR_NAME || secrets.ACR_NAME }}
    steps:
      - name: Checkout Code (with write permissions)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm Chart values.yaml
        run: |
          IMAGE_TAG="${{ needs.docker-acr-build-push.outputs.image_tag }}"
          VALUES_FILE="deploy/helm/refitdemo/values.yaml"
          
          echo "Updating $VALUES_FILE to image tag: $IMAGE_TAG"
          sed -i "s/^  tag: .*/  tag: \"$IMAGE_TAG\"/" "$VALUES_FILE"
          
          echo "Updating $VALUES_FILE to repository: ${ACR_NAME}.azurecr.io/refitdemo"
          sed -i "s|^  repository: .*|  repository: ${ACR_NAME}.azurecr.io/refitdemo|" "$VALUES_FILE"

      - name: Commit & Push GitOps Changes to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add deploy/helm/refitdemo/values.yaml
          
          # Only commit if changes exist
          if ! git diff --cached --quiet; then
            git commit -m "chore(gitops): update refitdemo image tag to ${{ needs.docker-acr-build-push.outputs.image_tag }} [skip ci]"
            git push origin main
          else
            echo "No changes to commit in values.yaml."
          fi
